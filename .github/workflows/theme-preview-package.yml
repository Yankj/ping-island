name: Theme V3 + Settings UX Preview Package

on:
  push:
    branches:
      - build/theme-v3-preview-package
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-v3-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Test and build Universal unsigned preview
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Run prototype tests
        run: >
          swift test --package-path Prototype
          --skip IslandBridgeE2ETests
          --skip SocketServerTests

      - name: Run Xcode unit tests
        run: >
          xcodebuild
          -project PingIsland.xcodeproj
          -scheme PingIsland
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/TestDerivedData"
          -resultBundlePath "$RUNNER_TEMP/PingIslandTests.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test
          -only-testing:PingIslandTests

      - name: Upload Settings theme screenshots
        uses: actions/upload-artifact@v4
        with:
          name: PingIsland-theme-v3-screenshots-${{ github.sha }}
          path: build/theme-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PingIsland-theme-v3-tests-${{ github.sha }}
          path: ${{ runner.temp }}/PingIslandTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
